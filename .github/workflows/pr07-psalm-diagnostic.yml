name: PR07 Psalm Diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'audit/pr-07-psalm-diagnostic-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve PR07 generator
        run: cp .github/scripts/pr07-build.py /tmp/pr07-build.py

      - name: Checkout exact PR06 baseline
        env:
          PR06: eb53b7a43c9496854e0db3c0f7f5fa31a633e2ac
        run: |
          git reset --hard "$PR06"
          git clean -fdx

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, curl, fileinfo, bcmath, xml, dom, ctype, tokenizer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Capture baseline Psalm JSON
        run: |
          set +e
          ./vendor/bin/psalm --show-info=true --output-format=json > /tmp/baseline.json
          status=$?
          set -e
          echo "baseline_status=$status"
          test "$status" -eq 2

      - name: Generate corrected PR07 candidate
        run: |
          python /tmp/pr07-build.py
          python - <<'PY'
          from pathlib import Path

          path = Path('app/Services/TorrentClients/BaseTorrentClient.php')
          text = path.read_text()
          old = """    /**\n     * Define mappings between internal config keys and DuckieTV settings keys.\n     *\n     * @return array<string, string>\n     */\n    protected function http(): PendingRequest\n    {\n        return Http::connectTimeout(self::CONNECT_TIMEOUT_SECONDS)\n            ->timeout(self::REQUEST_TIMEOUT_SECONDS);\n    }\n\n    protected function getConfigMappings(): array\n"""
          new = """    protected function http(): PendingRequest\n    {\n        return Http::connectTimeout(self::CONNECT_TIMEOUT_SECONDS)\n            ->timeout(self::REQUEST_TIMEOUT_SECONDS);\n    }\n\n    /**\n     * Define mappings between internal config keys and DuckieTV settings keys.\n     *\n     * @return array<string, string>\n     */\n    protected function getConfigMappings(): array\n"""
          if text.count(old) != 1:
              raise SystemExit('BaseTorrentClient docblock marker mismatch')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/Services/TorrentClients/QBittorrentClient.php')
          text = path.read_text()
          marker = "    public function readConfig(): void\n"
          if text.count(marker) != 1:
              raise SystemExit('QBittorrent readConfig marker mismatch')
          path.write_text(text.replace(marker, "    #[\\Override]\n" + marker, 1))
          PY

      - name: Capture candidate Psalm JSON
        run: |
          set +e
          ./vendor/bin/psalm --show-info=true --output-format=json > /tmp/candidate.json
          status=$?
          set -e
          echo "candidate_status=$status"
          test "$status" -eq 2

      - name: Compare diagnostic multisets
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              raw = json.loads(Path(path).read_text())
              if isinstance(raw, dict):
                  for key in ('issues', 'errors'):
                      if isinstance(raw.get(key), list):
                          raw = raw[key]
                          break
              if not isinstance(raw, list):
                  raise SystemExit(f'unexpected Psalm JSON shape in {path}: {type(raw).__name__}')
              return raw

          def norm(item):
              file_name = item.get('file_name') or item.get('file_path') or item.get('file') or ''
              issue_type = item.get('type') or item.get('issue_type') or ''
              message = item.get('message') or item.get('description') or ''
              severity = item.get('severity') or 'error'
              return (file_name, issue_type, message, severity)

          baseline = load('/tmp/baseline.json')
          candidate = load('/tmp/candidate.json')
          b = Counter(map(norm, baseline))
          c = Counter(map(norm, candidate))
          added = c - b
          removed = b - c

          def counts(items):
              out = Counter()
              for item in items:
                  out[item.get('severity') or 'error'] += 1
              return out

          print('BASELINE_JSON_COUNTS', dict(counts(baseline)))
          print('CANDIDATE_JSON_COUNTS', dict(counts(candidate)))
          print('ADDED_COUNT', sum(added.values()))
          for diag, n in sorted(added.items()):
              print('ADDED', n, *diag, sep=' | ')
          print('REMOVED_COUNT', sum(removed.values()))
          for diag, n in sorted(removed.items()):
              print('REMOVED', n, *diag, sep=' | ')
          PY
