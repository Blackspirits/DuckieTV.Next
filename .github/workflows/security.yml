name: "Security Scan"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 1 * * 0' # Run weekly

# JavaScript CodeQL is managed by GitHub Code Scanning default setup.
# Keep this workflow focused on repository-managed PHP/Larastan analysis.
jobs:
  larastan-php:
    name: Larastan (PHP)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-progress

      - name: Diagnostic Larastan Table
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=table

      # Run Larastan and output to a .sarif file
      - name: Run Larastan Analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=sarif > phpstan-results.sarif

      # Upload the PHP results to GitHub Security Tab even when analysis finds
      # a new regression and exits non-zero.
      - name: Upload Analysis Results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpstan-results.sarif
          category: php-larastan
