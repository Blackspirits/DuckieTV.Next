name: Static Baseline Builder

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate Psalm baseline
        run: |
          ./vendor/bin/psalm --set-baseline=psalm-baseline.xml || test -s psalm-baseline.xml

      - name: Generate PHPStan baseline
        run: |
          ./vendor/bin/phpstan analyse --memory-limit=2G --generate-baseline=phpstan-baseline.neon || test -s phpstan-baseline.neon

      - name: Push generated baselines to temporary output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psalm-baseline.xml phpstan-baseline.neon
          git commit -m "chore: materialize static-analysis baselines"
          git push --force origin HEAD:audit/tmp-static-baseline-output
