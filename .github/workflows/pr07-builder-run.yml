name: PR07 Candidate Builder

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'audit/pr-07-builder-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify builder prerequisite
        env:
          PR06: eb53b7a43c9496854e0db3c0f7f5fa31a633e2ac
        run: |
          actual="$(git diff --name-only "$PR06" HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/pr07-build.py' '.github/workflows/pr07-builder-run.yml' | sort)"
          test "$actual" = "$expected"
          cp .github/scripts/pr07-build.py /tmp/pr07-build.py

      - name: Reset to exact PR06 and generate candidate
        env:
          PR06: eb53b7a43c9496854e0db3c0f7f5fa31a633e2ac
        run: |
          git reset --hard "$PR06"
          git clean -fdx
          python /tmp/pr07-build.py
          python - <<'PY'
          from pathlib import Path

          # Make the async visibility assertion deterministic without weakening it.
          path = Path('tests/Frontend/PollingReliability.mjs')
          text = path.read_text()
          old = """await Promise.resolve();\nawait Promise.resolve();\nawait Promise.resolve();\nif (scheduledDelayExcluding(10000) !== 4000) throw new Error('first disconnected response did not back off to 4000 ms');"""
          new = """for (let i = 0; i < 20 && visibilityService.inFlight; i += 1) {\n    await Promise.resolve();\n}\nif (visibilityService.inFlight) throw new Error('visible resumed poll did not settle');\nif (scheduledDelayExcluding(10000) !== 4000) throw new Error('first disconnected response did not back off to 4000 ms');"""
          if text.count(old) != 1:
              raise SystemExit('PollingReliability.mjs: expected visibility await block once')
          path.write_text(text.replace(old, new))

          # This unit test needs the Laravel container for Cache/Crypt/Http facades.
          path = Path('tests/Unit/Services/QBittorrentSessionReuseTest.php')
          text = path.read_text()
          marker = "use Illuminate\\Support\\Facades\\Http;\n"
          replacement = marker + "\nuses(Tests\\TestCase::class);\n"
          if text.count(marker) != 1:
              raise SystemExit('QBittorrentSessionReuseTest.php: expected Http import once')
          path.write_text(text.replace(marker, replacement, 1))

          # Keep the getConfigMappings() array-shape PHPDoc attached to that method,
          # not to the new PendingRequest helper. The misplaced docblock caused a
          # large Psalm cascade while runtime behavior remained correct.
          path = Path('app/Services/TorrentClients/BaseTorrentClient.php')
          text = path.read_text()
          old = """    /**\n     * Define mappings between internal config keys and DuckieTV settings keys.\n     *\n     * @return array<string, string>\n     */\n    protected function http(): PendingRequest\n    {\n        return Http::connectTimeout(self::CONNECT_TIMEOUT_SECONDS)\n            ->timeout(self::REQUEST_TIMEOUT_SECONDS);\n    }\n\n    protected function getConfigMappings(): array\n"""
          new = """    protected function http(): PendingRequest\n    {\n        return Http::connectTimeout(self::CONNECT_TIMEOUT_SECONDS)\n            ->timeout(self::REQUEST_TIMEOUT_SECONDS);\n    }\n\n    /**\n     * Define mappings between internal config keys and DuckieTV settings keys.\n     *\n     * @return array<string, string>\n     */\n    protected function getConfigMappings(): array\n"""
          if text.count(old) != 1:
              raise SystemExit('BaseTorrentClient.php: expected misplaced getConfigMappings PHPDoc once')
          text = text.replace(old, new, 1)
          text = text.replace('protected const CONNECT_TIMEOUT_SECONDS = 3;', 'protected const int CONNECT_TIMEOUT_SECONDS = 3;', 1)
          text = text.replace('protected const REQUEST_TIMEOUT_SECONDS = 8;', 'protected const int REQUEST_TIMEOUT_SECONDS = 8;', 1)
          path.write_text(text)

          path = Path('app/Services/TorrentClients/QBittorrentClient.php')
          text = path.read_text()
          text = text.replace('private const SESSION_CACHE_TTL_SECONDS = 300;', 'private const int SESSION_CACHE_TTL_SECONDS = 300;', 1)

          read_config = "    public function readConfig(): void\n"
          if text.count(read_config) != 1:
              raise SystemExit('QBittorrentClient.php: expected readConfig once')
          text = text.replace(read_config, "    #[\\Override]\n" + read_config, 1)

          cached_request = """        if ($this->cookie !== null) {\n            $response = $this->http()\n                ->withHeaders(['Cookie' => $this->cookie])\n                ->get($this->getUrl('torrents/info'));\n"""
          cached_request_typed = """        if ($this->cookie !== null) {\n            /** @var \\Illuminate\\Http\\Client\\Response $response */\n            $response = $this->http()\n                ->withHeaders(['Cookie' => $this->cookie])\n                ->get($this->getUrl('torrents/info'));\n"""
          if text.count(cached_request) != 1:
              raise SystemExit('QBittorrentClient.php: expected cached SID request once')
          text = text.replace(cached_request, cached_request_typed, 1)

          login_cookie = """            $this->cookie = $response->header('Set-Cookie');\n            $this->connected = true;\n\n            if ($this->cookie !== null) {\n                $this->cacheCookie($this->cookie);\n            }\n\n            return true;\n"""
          login_cookie_checked = """            $this->cookie = $response->header('Set-Cookie');\n            if ($this->cookie === '') {\n                $this->connected = false;\n\n                throw new Exception('qBittorrent login succeeded without a session cookie');\n            }\n\n            $this->connected = true;\n            $this->cacheCookie($this->cookie);\n\n            return true;\n"""
          if text.count(login_cookie) != 1:
              raise SystemExit('QBittorrentClient.php: expected login cookie block once')
          path.write_text(text.replace(login_cookie, login_cookie_checked, 1))
          PY

      - name: Verify exact candidate surface
        run: |
          actual="$(git status --porcelain | sed 's/^...//' | sort)"
          expected="$(cat <<'EOF' | sort
          app/Services/TorrentClients/Aria2Client.php
          app/Services/TorrentClients/BaseTorrentClient.php
          app/Services/TorrentClients/DelugeClient.php
          app/Services/TorrentClients/KTorrentClient.php
          app/Services/TorrentClients/QBittorrentClient.php
          app/Services/TorrentClients/RTorrentClient.php
          app/Services/TorrentClients/TixatiClient.php
          app/Services/TorrentClients/TransmissionClient.php
          app/Services/TorrentClients/TTorrentClient.php
          app/Services/TorrentClients/UTorrentClient.php
          app/Services/TorrentClients/UTorrentWebUIClient.php
          public/js/PollingService.js
          tests/Frontend/PollingReliability.mjs
          tests/Unit/PollingReliabilityTest.php
          tests/Unit/Services/QBittorrentSessionReuseTest.php
          tests/Unit/Services/TorrentClientHttpPolicyTest.php
          EOF
          )"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          test "$(grep -R -l 'Http::' app/Services/TorrentClients | wc -l)" -eq 1
          test "$(grep -R -o 'Http::' app/Services/TorrentClients | wc -l)" -eq 1
          grep -q 'Http::connectTimeout' app/Services/TorrentClients/BaseTorrentClient.php
          git diff --check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, curl, fileinfo, bcmath, xml, dom, ctype, tokenizer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm audit --audit-level=low
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: PHP syntax
        run: |
          php -l app/Services/TorrentClients/BaseTorrentClient.php
          for file in app/Services/TorrentClients/*Client.php; do php -l "$file"; done
          php -l tests/Unit/PollingReliabilityTest.php
          php -l tests/Unit/Services/QBittorrentSessionReuseTest.php
          php -l tests/Unit/Services/TorrentClientHttpPolicyTest.php

      - name: Frontend regression
        run: node tests/Frontend/PollingReliability.mjs

      - name: Focused PHP regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test tests/Unit/PollingReliabilityTest.php tests/Unit/Services/TorrentClientHttpPolicyTest.php tests/Unit/Services/QBittorrentSessionReuseTest.php

      - name: Pint
        run: |
          ./vendor/bin/pint app/Services/TorrentClients/QBittorrentClient.php
          ./vendor/bin/pint --test

      - name: Full suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

      - name: Psalm baseline guard
        run: |
          set +e
          ./vendor/bin/psalm --show-info=true --output-format=json > /tmp/candidate-psalm.json
          psalm_status=$?
          set -e
          test "$psalm_status" -eq 2
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          issues = json.loads(Path('/tmp/candidate-psalm.json').read_text())
          counts = Counter(item.get('severity') or 'error' for item in issues)
          errors = counts['error']
          infos = counts['info']
          print(f'Psalm candidate: errors={errors} other_issues={infos}')
          if errors > 597 or infos > 776:
              raise SystemExit(f'Psalm baseline regression: {errors}/{infos} > 597/776')

          changed = {
              'app/Services/TorrentClients/Aria2Client.php',
              'app/Services/TorrentClients/BaseTorrentClient.php',
              'app/Services/TorrentClients/DelugeClient.php',
              'app/Services/TorrentClients/KTorrentClient.php',
              'app/Services/TorrentClients/QBittorrentClient.php',
              'app/Services/TorrentClients/RTorrentClient.php',
              'app/Services/TorrentClients/TixatiClient.php',
              'app/Services/TorrentClients/TransmissionClient.php',
              'app/Services/TorrentClients/TTorrentClient.php',
              'app/Services/TorrentClients/UTorrentClient.php',
              'app/Services/TorrentClients/UTorrentWebUIClient.php',
          }
          local = [item for item in issues if item.get('file_name') in changed]
          print(f'Psalm diagnostics in changed PHP files: {len(local)}')
          for item in local:
              print(item.get('severity'), item.get('file_name'), item.get('type'), item.get('message'))
          if local:
              raise SystemExit('PR07 changed PHP files must introduce no Psalm diagnostics')
          PY

      - name: Materialize replacement candidate branch
        env:
          PR06: eb53b7a43c9496854e0db3c0f7f5fa31a633e2ac
        run: |
          rm -f .env.testing
          git status --porcelain
          git config user.name BlackSpirits
          git config user.email blackspirits@gmail.com
          git add app/Services/TorrentClients public/js/PollingService.js tests/Frontend/PollingReliability.mjs tests/Unit/PollingReliabilityTest.php tests/Unit/Services/QBittorrentSessionReuseTest.php tests/Unit/Services/TorrentClientHttpPolicyTest.php
          git commit -m 'perf: bound torrent polling and client HTTP requests'
          test "$(git rev-parse HEAD^)" = "$PR06"
          test "$(git diff --name-only "$PR06" HEAD | wc -l)" -eq 16
          test -z "$(git status --porcelain)"
          git push --force-with-lease=refs/heads/audit/pr-07-polling-reliability:0af33f4154fd4ed85d0051b3eabc77db7d6888cf origin HEAD:refs/heads/audit/pr-07-polling-reliability
